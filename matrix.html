<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CX Macierz punktów styku</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/matrix.css">
</head>
<body>
<div class="app-shell" id="app">
  <header class="topbar">
    <a class="brand" href="matrix.html" aria-label="CX Experience Explorer: macierz punktów styku">
      <span class="brand-icon">CX<span>✳</span></span>
      <span class="brand-name">EXPERIENCE <b>EXPLORER</b><small>MACIERZ PUNKTÓW STYKU</small></span>
    </a>
    <nav class="top-nav" aria-label="Widoki"><a href="index.html">Mapa podróży</a><a href="matrix.html" aria-current="page">Macierz</a><a href="mapa.html">Przepływ</a><a href="priorytety.html">Priorytety</a><a href="radar.html">Radar</a></nav>
    <div class="top-actions"><span class="offline"><i></i> DZIAŁA OFFLINE</span></div>
  </header>

  <main id="top">
    <section class="journey-heading" aria-label="Macierz punktów styku">
      <div><h1>Macierz punktów styku</h1><p>Klienta z marką</p></div>
      <span class="demo-pill" id="demoPill" hidden>DANE DEMO</span>
    </section>

    <section class="matrix-toolbar" aria-label="Filtry">
      <label class="select-wrap matrix-select"><span>MACIERZ</span><select id="matrixSelect" aria-label="Wybierz macierz"></select></label>
      <div class="chips" id="chips" role="group" aria-label="Filtr oceny CX"></div>
      <div class="chips" id="subs" role="group" aria-label="Podtyp dealera i serwisu"></div>
      <div class="presets"><button type="button" id="onlyRed" class="ghost">Tylko czerwone</button><button type="button" id="allRatings" class="ghost">Wszystkie</button></div>
      <div class="legend-tip"><button type="button" class="legend-btn" aria-describedby="legend" aria-label="Legenda">?</button><p class="legend" id="legend" role="tooltip"></p></div>
      <button type="button" id="discuss" class="primary" title="Omawianie: najpierw niezaopiekowane, potem do poprawy. Kolejność jak w danych (proces, punkt); to kolejność robocza, nie priorytet CX.">Omawiaj ▶</button>
      <div class="discuss-bar" id="discussBar" hidden>
        <button type="button" id="spotPrev" aria-label="Poprzedni punkt">←</button>
        <strong id="spotCount"></strong>
        <button type="button" id="spotNext" aria-label="Następny punkt">→</button>
        <button type="button" id="spotEnd" class="ghost">Zakończ omawianie</button>
      </div>
    </section>

    <section class="workspace" id="workspace" aria-label="Macierz i szczegóły">
      <div class="workspace-main">
        <div class="map-panel" id="gridPanel">
          <div class="matrix-scroll"><div class="matrix-grid" id="matrixGrid"></div></div>
        </div>
      </div>
      <aside class="detail-drawer" id="detailDrawer" hidden aria-label="Szczegóły punktu styku">
        <div class="drawer-heading"><div><span class="eyebrow">SZCZEGÓŁY PUNKTU STYKU</span><span class="drawer-perspective">EMOCJE · <b>KLIENT</b></span></div><button class="icon-button" id="closeDetails" type="button" aria-label="Zamknij szczegóły">×</button></div>
        <div id="detailBody"></div>
      </aside>
    </section>
    <div class="sr-only" id="live" aria-live="polite"></div>
  </main>
</div>
<div id="errorScreen" class="error-screen" hidden><h1>Nie można uruchomić macierzy</h1><p id="errorText"></p><small>Sprawdź plik data/matrix.js i odśwież stronę.</small></div>
<script src="data/matrix.js"></script>
<script src="js/matrix-core.js"></script>
<script src="js/matrix.js"></script>
</body>
</html>
